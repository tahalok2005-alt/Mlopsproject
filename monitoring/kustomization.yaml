apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheus-k8s.yaml
  - grafana-k8s.yaml
# Reuses the same Grafana files as docker-compose, so there is one copy of the dashboard.
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus-k8s-config.yml
  - name: grafana-datasources
    files:
      - grafana/provisioning/datasources/datasource.yml
  - name: grafana-dashboards
    files:
      - grafana/provisioning/dashboards/dashboards.yml
      - grafana/provisioning/dashboards/wine-api.json
